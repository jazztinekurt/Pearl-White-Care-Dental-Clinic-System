<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit trail | Pearl White Dental Clinic</title>
    <link rel="icon" href="images/pearl-white-logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sb">
        <a class="lk" href="index.html"
          ><span class="tl"
            ><img src="images/pearl-white-logo.png" alt="" height="28" /></span
          ><span><b>Pearl White</b><small>Dental Clinic</small></span></a
        >
        <p class="rl">Clinic owner</p>
        <nav aria-label="Main">
          <a class="nv" href="admin-dashboard.html">Dashboard</a>
          <a class="nv" href="admin-users.html">Users and staff</a>
          <a class="nv" href="admin-schedule.html">Master schedule</a>
          <a class="nv" href="admin-reports.html">Reports</a>
          <a class="nv on" href="admin-audit.html" aria-current="page">Audit trail</a>
          <a class="nv" href="admin-archive.html">Archive</a>
          <a class="nv" href="admin-settings.html">Settings</a>
        </nav>
      </aside>

      <main class="mn">
        <header class="tb">
          <div>
            <h1 id="title">Audit trail</h1>
            <p id="sub">Who did what, and when. Clinical details are never logged here.</p>
          </div>
          <div class="me">
            <i>JT</i
            ><span><b>Dr. Jena Tan-Booth</b><small>Clinic owner</small></span>
            <a href="login.html">Log out</a>
          </div>
        </header>

        <section class="cd">
          <div class="fg audit-filters">
            <label class="f"><span>Search</span><input id="q" type="search" placeholder="e.g. OR-00419, P-0142, deactivated" autocomplete="off" /></label>
            <label class="f"><span>User</span><select id="user"><option value="">Everyone</option></select></label>
            <label class="f"><span>Type</span><select id="type"><option value="">All types</option></select></label>
            <label class="f"><span>From</span><input id="from" type="date" /></label>
            <label class="f"><span>To</span><input id="to" type="date" /></label>
          </div>
          <div class="hd" style="margin: 16px 0 6px">
            <p class="hint" id="count" style="margin: 0"></p>
            <button type="button" class="btn2 sm" id="csv">Export CSV</button>
          </div>
          <div class="tw"><table><thead><tr><th>When</th><th>User</th><th>Role</th><th>Type</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
        </section>

        <p class="ft">Prototype page with sample data.</p>
      </main>
    </div>

    <script src="staff.js"></script>
    <script src="admin.js"></script>
    <script>
      (() => {
      const $ = (id) => document.getElementById(id);
      const fmt = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const plus = (iso, n) => { const d = ST.toDate(iso); d.setDate(d.getDate() + n); return fmt(d); };
      const monday = (iso) => { const d = ST.toDate(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmt(d); };
      const kpeso = (n) =>
        n >= 1e6 ? "₱" + (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M"
        : n >= 1000 ? "₱" + (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "") + "k" : ST.peso(n);
      const when = (isoTime) => {
        const d = new Date(isoTime);
        const day = fmt(d) === ST.today() ? "Today" : fmt(d) === plus(ST.today(), -1) ? "Yesterday" : d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        return day + ", " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
      };
      function say(id, text, kind) {
        const m = $(id);
        m.hidden = false;
        m.className = "banner " + (kind || "ok");
        m.innerHTML = text;
      }

      const all = AD.audit();
      [...new Set(all.map((e) => e.user))].sort().forEach((u) => $("user").insertAdjacentHTML("beforeend", "<option>" + u + "</option>"));
      [...new Set(all.map((e) => e.type))].sort().forEach((t) => $("type").insertAdjacentHTML("beforeend", "<option>" + t + "</option>"));
      $("to").value = ST.today();
      $("from").value = plus(ST.today(), -30);
      let shown = [];
      function render() {
        const q = $("q").value.trim().toLowerCase();
        shown = all.filter((e) => {
          const d = e.at.slice(0, 10) <= ST.today() ? fmt(new Date(e.at)) : e.at.slice(0, 10);
          return (!q || (e.action + e.user).toLowerCase().includes(q)) && (!$("user").value || e.user === $("user").value) &&
            (!$("type").value || e.type === $("type").value) && (!$("from").value || d >= $("from").value) && (!$("to").value || d <= $("to").value);
        });
        $("count").textContent = shown.length + (shown.length === 1 ? " entry" : " entries");
        $("rows").innerHTML = shown.map((e) =>
          "<tr><td>" + when(e.at) + "</td><td>" + e.user + "</td><td>" + AD.roleBadge(e.role) + '</td><td><span class="bd">' + e.type + "</span></td><td>" +
          ST.esc(e.action) + "</td></tr>").join("") || '<tr><td colspan="5" class="empty">Nothing matches these filters.</td></tr>';
      }
      ["q", "user", "type", "from", "to"].forEach((id) => ($(id)[id === "q" ? "oninput" : "onchange"] = render));
      $("csv").onclick = () => AD.downloadCsv("pearl-white-audit-trail.csv",
        [["Date and time", "User", "Role", "Type", "Action"]].concat(shown.map((e) => [new Date(e.at).toLocaleString("en-PH"), e.user, e.role, e.type, e.action])));
      render();
      })();
    </script>
  </body>
</html>
